
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Cognitive Crypto Dashboard</title>
    
    <!-- Typography: Inter (UI) & JetBrains Mono (Data/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              'term-bg': '#0b0e11', // Deepest background (Main)
              'term-panel': '#15191f', // Secondary panels
              'term-header': '#1b2028', // Headers
              'term-border': '#2a3441', // Borders
              'term-accent': '#3b82f6', // Primary Action Blue
              'trade-up': '#10b981', // Candle Green
              'trade-down': '#ef4444', // Candle Red
              'text-main': '#e2e8f0',
              'text-muted': '#64748b',
              'status-warn': '#f59e0b', // Amber for stale data
              'status-offline': '#a855f7', // Purple for historical/offline
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(59, 130, 246, 0.15)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0b0e11;
        color: #e2e8f0;
        overflow-x: hidden; /* Prevent horizontal scroll on body */
      }
      
      /* Pro Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b0e11; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2a3441; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6; 
      }

      /* Utility: Hide Scrollbar for Clean Swipe UI */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "recharts": "https://esm.sh/recharts@^2.12.0",
    "recharts/": "https://esm.sh/recharts@^3.7.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="antialiased selection:bg-term-accent selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
